pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            url = "https://maven.neoforged.net/releases"
        }
        mavenCentral()
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == 'net.neoforged.moddev') {
                useModule("net.neoforged:moddev-gradle:${requested.version}")
            }
        }
    }
}

// 非正式版构建时，将 NT 保护模组作为 composite build 引入
// 正式版：./gradlew build -Prelease（不引入 NT）
